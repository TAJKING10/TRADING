name: Refresh dashboard scan

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (free on GitHub Actions for public repos)
  workflow_dispatch: {}    # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan (public market data only, no API keys needed)
        env:
          # Overridable in GitHub repo Settings -> Secrets and variables -> Actions -> Variables,
          # without touching code. Binance blocks GitHub-runner IPs with HTTP 451
          # (geo-restriction), so KuCoin is the default training-data exchange here.
          EXCHANGE: ${{ vars.EXCHANGE || 'kraken' }}
          TRAINING_DATA_EXCHANGE: ${{ vars.TRAINING_DATA_EXCHANGE || 'kucoin' }}
          # Default is Kraken's base-tier spot taker fee (0.80%, Oct 2026). Override
          # via repo Variables once you know your actual account's fee tier.
          TAKER_FEE_PCT: ${{ vars.TAKER_FEE_PCT || '0.008' }}
          SLIPPAGE_PCT: ${{ vars.SLIPPAGE_PCT || '0.0005' }}
          # Set in repo Settings -> Secrets and variables -> Actions -> Secrets to enable
          # pushing scan history + accuracy tracking to Supabase. Safe to leave unset.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python main.py scan

      - name: Commit updated dashboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git commit -m "Auto-update dashboard scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          # The scan can run 15-20+ min; origin/main may have moved in that time
          # (another push, an overlapping run). A plain `git push` then fails with
          # a non-fast-forward rejection and the whole scan's output is lost. Only
          # site/ changes here (machine-generated), so rebasing onto new upstream
          # commits is safe -- retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed (origin/main likely moved) -- retrying..."
            sleep 10
          done
          echo "::error::Failed to push dashboard update after 5 attempts." >&2
          exit 1
